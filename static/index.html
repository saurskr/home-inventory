<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Inventory</title>
<link rel="stylesheet" href="ds/tokens/tokens.css">
<link rel="stylesheet" href="ds/base/base.css">
<link rel="stylesheet" href="ds/components/shell/shell.css">
<link rel="stylesheet" href="ds/components/status/status.css">
<link rel="stylesheet" href="ds/components/panel/panel.css">
<link rel="stylesheet" href="ds/components/card/card.css">
<style>
/* App-specific layout only; every colour, radius and font comes from the design system tokens. */
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--accent)}
.lead{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{cursor:pointer;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile h3{margin:0;font-size:15px}
.tile .btns{margin-top:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.small{padding:2px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);display:block}
.sub{color:var(--muted);font-size:12px}
.preview{max-width:100%;max-height:160px;border-radius:var(--r-sm);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addr3{display:grid;grid-template-columns:minmax(0,1fr) 110px 120px;gap:10px}
.err{color:var(--red);min-height:1.2em;margin-top:8px}
.editor .form-fields{max-width:640px;display:flex;flex-direction:column;gap:10px}
.form-actions{margin-top:4px}
.editor a,.pane a,.tray a{color:var(--accent)}
/* floating tray for editing an item */
.tray-scrim{position:fixed;inset:0;background:rgba(10,14,20,.32);z-index:40}
.tray{position:fixed;z-index:50;top:64px;left:var(--tray-left,256px);width:min(820px,calc(100vw - var(--tray-left,256px) - 24px));
  max-height:calc(100vh - 84px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);
  border:1px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow);animation:trayIn .16s ease-out}
@keyframes trayIn{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.tray{animation:none}}
.tray-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.tray-head h2{margin:0}
.tray-body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.tray .form-fields.wide{max-width:none}
.tray .err:empty{display:none}
@media(max-width:860px){.tray{left:12px;top:60px;width:calc(100vw - 24px)}}
.idmsg.err{color:var(--red);font-weight:600}
/* toolbar buttons */
.toolbar button.add{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;font-size:14px;font-weight:600}
.add svg,.drop svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.add svg{width:16px;height:16px;stroke-width:1.9}
/* spinner: "the model is working" */
.spin{display:inline-block;width:14px;height:14px;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
.spin.lg{width:34px;height:34px;border-width:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* photo drop zone and preview */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:150px;padding:14px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);cursor:pointer;background:var(--surface-2);font-size:13px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--text)}
.drop b{color:var(--text);font-size:14px}
.drop svg{width:30px;height:30px;stroke-width:1.5}
.photo-col:has(.sr-only:focus-visible) .drop,.batch-pick:has(.sr-only:focus-visible) .drop{outline:3px solid var(--accent);outline-offset:2px}
.photo-box{position:relative}
.preview-lg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2)}
.photo-busy{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);border-radius:var(--r-sm);font-size:13px;font-weight:600}
.photo-box.busy .photo-busy{display:flex}
.btn-like{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:2px 10px;font-size:12px;cursor:pointer}
.btn-like:hover{background:var(--surface-2)}
.more summary{cursor:pointer;font-size:13px;color:var(--muted)}
.more input{margin-top:6px}
/* two-column Add Item: photo on the left, fields on the right */
.item-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.photo-col{display:flex;flex-direction:column;gap:8px}
.item-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.item-grid .s2{grid-column:span 2}
.item-grid .s4{grid-column:span 4}
.item-grid textarea{min-height:56px}
.editor.wide .form-fields{max-width:none}
@media(max-width:900px){.item-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.item-grid .s4{grid-column:span 2}}
@media(max-width:700px){.item-layout{grid-template-columns:1fr}.item-grid{grid-template-columns:1fr}.item-grid .s2,.item-grid .s4{grid-column:auto}}
/* find similar */
.find-box{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.stores{display:flex;flex-wrap:wrap;gap:6px}
/* add items by image */
.batch-pick{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.batch-opts{display:flex;flex-direction:column;gap:10px}
.bq{display:flex;flex-direction:column;gap:6px}
.bq-item{display:flex;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.bq-main{flex:1;min-width:0}
.err-text{color:var(--red)}
.thumb.sm{width:28px;height:28px;display:inline-block;vertical-align:middle;margin-right:6px}
table.rv td,table.rv th{padding:5px 8px}
table.rv input:not([type=checkbox]),table.rv select{padding:3px 6px;min-width:70px}
table.rv td.num input{width:80px;text-align:right}
table.rv td:nth-child(2){white-space:nowrap}
table.rv td:nth-child(2) input{width:calc(100% - 40px);min-width:160px}
.rv-head td{background:var(--surface-2);font-size:13px}
@media(max-width:700px){.batch-pick{grid-template-columns:1fr}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--head);color:var(--head-text);
  padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.top h1{font-size:18px}
/* actions row directly under the header */
.toolbar{max-width:1280px;margin:0 auto;padding:16px 24px 0;display:flex;gap:8px;align-items:center}
/* home display */
.grid.homes{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.hb{display:flex;flex-direction:column;gap:8px}
.hb h3{margin:0;font-size:16px}
.hb h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hb-addr{font-size:13px}
.hb a{color:var(--accent)}
.hb-ins{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hb-limits{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.status{--c:var(--grey);display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text);
  border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
.status .gl{color:var(--c)}
dl.lim{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:0;font-size:13px}
dl.lim dt{color:var(--muted)}
dl.lim dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
/* inline home editor */
.editor{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ins-sec{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px}
.ins-sec>summary{cursor:pointer}
.subhead{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rider{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;margin-bottom:8px}
/* density toggle */
.seg{display:inline-flex}
.themebtn{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;font-size:12px}
.seg button{border-radius:0;padding:4px 10px;font-size:12px}
.seg button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.seg button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
/* two-pane room layout: item pane on the left, list on the right */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.pane{position:sticky;top:72px}
.pane-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.pane h3{margin:0;font-size:16px}
.pane h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2)}
.ph.sm{aspect-ratio:16/9}
.ph-empty{display:grid;place-items:center;height:84px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:13px}
.ph-empty.sm{height:64px}
.pane dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.pane dt{color:var(--muted)}
.pane dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pane .desc{font-size:13px;color:var(--muted);white-space:pre-wrap}
.pane .links a{word-break:break-all}
.flags{display:flex;flex-direction:column;gap:4px;font-size:13px}
.flags div{display:flex;gap:8px;align-items:center}
/* status icons: photo / equivalent link / price */
.ico{display:inline-flex;gap:5px;align-items:center}
.ic{display:inline-flex}
.ic svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.ic.yes,.ic.current{color:var(--green)}
.ic.stale{color:var(--amber)}
.ic.no,.ic.none{color:var(--grey);opacity:.6}
.ic.no .g,.ic.none .g{stroke-dasharray:2 2}
.ic .bd{fill:currentColor;stroke:none}
.ic .bk{stroke:var(--on-status);stroke-width:1.2}
/* item and room tables */
tr[data-id]{cursor:pointer}
.inv{white-space:nowrap;color:var(--muted);font-size:12px}
tbody tr[data-id]:hover{background:var(--surface-2)}
tr.sel,tr.sel:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 3px 0 0 var(--accent)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.legend{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
/* density */
html[data-density="compact"] th,html[data-density="compact"] td{padding:3px 10px;font-size:13px}
html[data-density="compact"] .thumb{width:24px;height:24px;border-radius:4px}
html[data-density="compact"] .ic svg{width:14px;height:14px}
html[data-density="compact"] .sub{display:inline;margin-left:6px}
html[data-density="compact"] td .btns button{padding:0 8px}
/* insurance */
.ins>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px}
.ins>summary::-webkit-details-marker{display:none}
.ins>summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s}
.ins[open]>summary::before{transform:rotate(90deg)}
.ins>summary h2{margin:0}
.ins .peek{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins[open]>summary{border-bottom:1px solid var(--line)}
.ins-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.ins-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.ins-grid .full{grid-column:1/-1}
.cov{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-size:13px}
.cov.ok{border-color:var(--green)}
.cov.gap{border-color:var(--amber)}
.cov b{white-space:nowrap}
@media(max-width:1000px){.split{grid-template-columns:1fr}.pane{position:static}.ins-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.th-txt{display:none}.two,.ins-grid,.addr3{grid-template-columns:1fr}.rider{grid-template-columns:minmax(0,1fr) 100px auto}.top{padding:10px 14px}.toolbar{padding:12px 14px 0}main{padding:12px 14px 50px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Home Inventory</div>
    <nav aria-label="Homes" id="nav"></nav>
    <div class="side-foot"><div class="who">Saved on this computer<small>No account, no cloud</small></div></div>
  </aside>
  <div class="content">
    <header class="top"><h1 id="title">Homes</h1>
      <div class="top-actions">
        <div class="seg" role="group" aria-label="List density">
          <button type="button" data-d="comfortable">Comfortable</button><button type="button" data-d="compact">Compact</button></div>
        <button id="theme" class="themebtn" type="button"></button></div></header>
    <div class="toolbar" id="toolbar" hidden><button class="primary add" id="add" type="button"></button><button class="add" id="add2" type="button" hidden></button></div>
    <main id="app"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n || 0).toLocaleString(undefined, {style:"currency", currency:"USD"});
let META = {item_types: [], room_templates: {}};

async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method, headers: {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}
const readFile = f => new Promise((ok, no) => {
  const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f);
});

/* ---------- theme: Auto / Light / Dark ---------- */
const THEMES = ["auto", "light", "dark"];
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  const label = "Theme: " + t[0].toUpperCase() + t.slice(1);
  $("#theme").innerHTML = '<span aria-hidden="true">◐</span><span class="th-txt">' + label + "</span>";
  $("#theme").setAttribute("aria-label", label + ". Click to change.");
}
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
if (!THEMES.includes(theme)) theme = "auto";
applyTheme(theme);
$("#theme").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("theme", theme); } catch (e) {}
  applyTheme(theme);
};

/* ---------- density: comfortable / compact ---------- */
let density = "comfortable";
try { density = localStorage.getItem("density") || "comfortable"; } catch (e) {}
function applyDensity(d) {
  density = d === "compact" ? "compact" : "comfortable";
  document.documentElement.setAttribute("data-density", density);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === density)));
}
applyDensity(density);
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  try { localStorage.setItem("density", b.dataset.d); } catch (e) {}
  applyDensity(b.dataset.d);
});

/* ---------- status icons and helpers ---------- */
const GLYPH = {
  photo: '<rect class="g" x="1.5" y="4" width="11" height="8.5" rx="2"/><circle class="g" cx="7" cy="8.2" r="2"/><path class="g" d="M4.6 4l.9-1.6h3l.9 1.6"/>',
  link: '<path class="g" d="M6.3 8.7l2.4-2.4"/><path class="g" d="M5.6 7.1L4.4 8.3a2.3 2.3 0 003.3 3.3l1.2-1.2"/><path class="g" d="M9.6 7.5l1.2-1.2a2.3 2.3 0 00-3.3-3.3L6.3 4.2"/>',
  price: '<path class="g" d="M1.5 8V2.5H7l6 6-5.5 5.5z"/><circle class="g" cx="4.7" cy="5.7" r=".9"/>'
};
const LABELS = {
  photo: {yes: "Photo added", no: "No photo"},
  link: {yes: "Equivalent-item link added", no: "No equivalent-item link"}
};
function icon(kind, state, label) {
  const good = state === "yes" || state === "current";
  const badge = good ? '<circle class="bd" cx="12.2" cy="12.2" r="3.6"/><path class="bk" d="M10.4 12.3l1.3 1.2 2.1-2.4"/>'
    : state === "stale" ? '<circle class="bd" cx="12.2" cy="12.2" r="3.6"/><path class="bk" d="M12.2 10.4v2M12.2 13.9v.1"/>' : "";
  return `<span class="ic ${state}" role="img" aria-label="${esc(label)}" title="${esc(label)}"><svg viewBox="0 0 16 16" aria-hidden="true">${GLYPH[kind]}${badge}</svg></span>`;
}
const PRICE_STALE_DAYS = 365;
function priceState(i) {
  if (!i.price_updated_at) return "none";
  return (Date.now() - Date.parse(i.price_updated_at)) / 864e5 > PRICE_STALE_DAYS ? "stale" : "current";
}
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"}) : "";
function priceLabel(i) {
  const st = priceState(i);
  return st === "none" ? "Price never updated"
    : st === "stale" ? "Price last updated " + fmtDate(i.price_updated_at) + " (over a year ago)"
    : "Price updated " + fmtDate(i.price_updated_at);
}
function itemIcons(i) {
  const ps = priceState(i);
  return `<span class="ico">${icon("photo", i.image ? "yes" : "no", i.image ? LABELS.photo.yes : LABELS.photo.no)}` +
    `${icon("link", i.similar_url ? "yes" : "no", i.similar_url ? LABELS.link.yes : LABELS.link.no)}` +
    `${icon("price", ps, priceLabel(i))}</span>`;
}
const safeUrl = u => /^https?:\/\/\S+$/i.test(u || "") ? u : null;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };

/* ---------- inline form panel: opens at the top of the page, never as a popup ---------- */
const closeEditors = () => document.querySelectorAll(".editor, #tray, #trayScrim").forEach(e => { if (e._cleanup) e._cleanup(); e.remove(); });
function form(title, html, onSubmit, {submit = "Save", hint = "", wide = false, tray = false, confirmClose = null} = {}) {
  const opener = document.activeElement;
  closeEditors();
  const panel = document.createElement(tray ? "aside" : "section");
  if (tray) {
    /* floating tray: Save / Cancel stay at the top; Esc, Cancel or a click outside closes it (asking first if there are changes) */
    panel.className = "tray"; panel.id = "tray"; panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", title);
    panel.innerHTML = `<div class="tray-head"><h2>${esc(title)}</h2><div class="btns form-actions">
        <button class="primary" type="submit" form="trayForm">${esc(submit)}</button><button type="button" data-x>Cancel</button></div></div>
      <form id="trayForm" class="tray-body"><div class="err" role="alert"></div><div class="form-fields wide">${html}</div></form>`;
    const scrim = document.createElement("div"); scrim.className = "tray-scrim"; scrim.id = "trayScrim";
    document.body.append(scrim, panel);
    const pane = $("#pane");
    if (pane) panel.style.setProperty("--tray-left", Math.max(12, Math.round(pane.getBoundingClientRect().left)) + "px");
    const close = () => { if (confirmClose && !confirmClose()) return; closeEditors(); if (opener && opener.isConnected) opener.focus(); };
    $("[data-x]", panel).onclick = close; scrim.onclick = close;
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey); panel._cleanup = () => document.removeEventListener("keydown", onKey);
  } else {
    panel.className = "panel editor" + (wide ? " wide" : ""); panel.id = "editor";
    panel.innerHTML = `<div class="panel-head"><h2>${esc(title)}</h2>${hint ? `<span class="sub">${esc(hint)}</span>` : ""}</div>
      <form class="ins-body"><div class="form-fields">${html}</div><div class="err" role="alert"></div>
      <div class="btns form-actions"><button class="primary">${esc(submit)}</button>
      <button type="button" data-x>Cancel</button></div></form>`;
    app.prepend(panel);
    $("[data-x]", panel).onclick = () => panel.remove();
    panel.onkeydown = e => { if (e.key === "Escape") panel.remove(); };
  }
  $("form", panel).onsubmit = async e => {
    e.preventDefault();
    try { await onSubmit($("form", panel)); }

  };

  const first = $("input,select,textarea", panel); if (first) first.focus();

}

/* ---------- insurance: status, limits ---------- */
const ymd = s => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtYmd = s => { const d = ymd(s); return d ? d.toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"}) : ""; };
function insStatus(ins) {
  if (!ins || !ins.configured) return {icon: "ℹ", text: "No insurance on file", c: "var(--grey)"};
  const d = ymd(ins.renewal_date);
  if (!d) return {icon: "ℹ", text: "Insured · no expiry date", c: "var(--blue)"};
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((d - today) / 864e5), when = fmtYmd(ins.renewal_date);
  if (days < 0) return {icon: "✖", text: "Expired " + when, c: "var(--red)"};
  if (days <= 30) return {icon: "⚠", text: `Expires in ${days} day${days === 1 ? "" : "s"} (${when})`, c: "var(--amber)"};
  return {icon: "✔", text: "Active · expires " + when, c: "var(--green)"};
}
function coverageGap(h) {
  const ins = h.insurance;
  if (!ins || ins.contents_coverage == null || !h.total_replacement) return "";  // nothing to compare yet
  const diff = ins.contents_coverage - h.total_replacement;
  return diff >= 0
    ? `<div class="cov ok"><span aria-hidden="true">✔</span><div>Contents coverage covers the ${money(h.total_replacement)} inventory value, with ${money(diff)} to spare.</div></div>`
    : `<div class="cov gap"><span aria-hidden="true">⚠</span><div><b>Contents coverage is short by ${money(-diff)}</b> against the ${money(h.total_replacement)} inventory value.</div></div>`;
}
function limitsHtml(h) {
  const ins = h.insurance;
  if (!ins || !ins.configured) return `<p class="muted" style="margin:0">No coverage limits recorded. Choose Edit to add insurance.</p>`;
  const row = (k, v) => v == null ? "" : `<dt>${k}</dt><dd>${money(v)}</dd>`;
  const main = row("Dwelling", ins.dwelling_coverage) + row("Contents", ins.contents_coverage) +
    row("Liability", ins.liability_coverage) + row("Deductible", ins.deductible) + row("Annual premium", ins.annual_premium);
  const riders = ins.riders || [];
  return (main || riders.length ? "" : `<p class="muted" style="margin:0">No limits entered yet.</p>`) +
    (main ? `<dl class="lim">${main}</dl>` : "") +
    (riders.length ? `<div><h4>Riders</h4><dl class="lim">${riders.map(r =>
      `<dt>${esc(r.name)}</dt><dd>${r.limit == null ? "—" : money(r.limit)}</dd>`).join("")}</dl></div>` : "") +
    (ins.policy_number ? `<div class="sub">Policy # ${esc(ins.policy_number)}</div>` : "") +
    (ins.contact ? `<div class="sub">Agent: ${esc(ins.contact)}</div>` : "") + coverageGap(h);
}

function homeBlock(h, page) {

function bindHome(el, h, opts) {
  el.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (b) {
      const act = b.dataset.act;
      if (act === "addr" || act === "lim") {
        setPref(act, h.id, !pref(act, h.id, act === "addr"));
        el.innerHTML = homeBlock(h, opts.page);
        const again = el.querySelector(`[data-act="${act}"]`); if (again) again.focus();
      } else if (act === "edit") opts.onEdit();

    }

}

function showHomeEditor(h) {
  closeEditors();
  const panel = document.createElement("section");
  panel.className = "panel editor"; panel.id = "homeEditor"; panel.innerHTML = homeEditorHtml(h);
  panel.onkeydown = e => { if (e.key === "Escape") panel.remove(); };
  app.prepend(panel);
  const ins = (h && h.insurance) || {};
  let riders = (ins.riders || []).map(r => ({name: r.name, limit: r.limit ?? ""}));
  const box = $("#riders", panel), addBtn = $("#addRider", panel), f = $("#homeForm", panel), err = $("#homeErr", panel);
  const drawRiders = () => {
    box.innerHTML = riders.map((r, i) => `<div class="rider">
      <input aria-label="Rider ${i + 1} name" data-i="${i}" data-k="name" placeholder="e.g. Jewelry &amp; watches" value="${esc(r.name)}">
      <input aria-label="Rider ${i + 1} limit ($)" data-i="${i}" data-k="limit" type="number" min="0" step="0.01" placeholder="Limit ($)" value="${esc(r.limit)}">
      <button type="button" class="small" data-rm="${i}" aria-label="Remove rider ${i + 1}">✕</button></div>`).join("");
    addBtn.disabled = riders.length >= 5; addBtn.textContent = `+ Add rider (${riders.length}/5)`;
  };
  box.oninput = e => { if (e.target.dataset.i !== undefined) riders[+e.target.dataset.i][e.target.dataset.k] = e.target.value; };
  box.onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { riders.splice(+b.dataset.rm, 1); drawRiders(); } };
  addBtn.onclick = () => {
    if (riders.length >= 5) return;
    riders.push({name: "", limit: ""}); drawRiders();
    const last = box.querySelectorAll('input[data-k="name"]'); last[last.length - 1].focus();
  };
  drawRiders();
  $("#clearIns", panel).onclick = () => {
    for (const k of ["insurer", "website", "policy_number", "renewal_date", "annual_premium", "dwelling_coverage",
      "contents_coverage", "liability_coverage", "deductible", "contact", "notes"]) f.elements[k].value = "";
    riders = []; drawRiders();
  };
  $("#homeCancel", panel).onclick = () => panel.remove();
  let current = h;  // after a first successful save, a retry updates instead of creating a duplicate
  f.onsubmit = async e => {
    e.preventDefault(); err.textContent = "";
    const g = k => f.elements[k].value.trim();
    try {
      const rows = riders.filter(r => r.name.trim() || String(r.limit).trim());
      if (rows.some(r => !r.name.trim())) throw new Error("Each rider needs a name.");
      const body = {name: g("name")};
      for (const k of ["street", "street2", "city", "state", "zip"]) body[k] = g(k);
      current = current ? await api("PUT", "/homes/" + current.id, body) : await api("POST", "/homes", body);
      const insBody = {riders: rows.map(r => ({name: r.name.trim(), limit: String(r.limit).trim()}))};
      for (const k of ["insurer", "website", "policy_number", "renewal_date", "annual_premium", "dwelling_coverage",
        "contents_coverage", "liability_coverage", "deductible", "contact", "notes"]) insBody[k] = g(k);
      const any = rows.length || Object.entries(insBody).some(([k, v]) => k !== "riders" && v);
      if (any) await api("PUT", `/homes/${current.id}/insurance`, insBody);
      else if (current.insurance && current.insurance.configured) await api("DELETE", `/homes/${current.id}/insurance`);
      toast("Home saved"); route();
    } catch (ex) { err.textContent = ex.message; }
  };
  panel.scrollIntoView({block: "nearest"});
  $("#h_name", panel).focus();
}

/* shrink a photo before sending it to a model: smaller upload, faster answer */
const downscale = (url, max = 1024) => new Promise((ok, no) => {
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.85));
  };
  im.onerror = () => no(new Error("This browser can't read that image. iPhone HEIC photos need converting to JPEG or PNG first."));
  im.src = url;
});

function setStatus(el, text, kind) {

/* ---------- Find similar: ask a few clarifying questions, then open a store search in a new tab ---------- */
const enc = encodeURIComponent;
const googleTbs = o => {
  const t = ["mr:1"];
  if (o.max) t.push("price:1", "ppr_max:" + o.max);
  if (o.cond === "new") t.push("new:1"); if (o.cond === "used") t.push("used:1");
  return "&tbs=" + t.join(",");
};
const STORES = {
  gshop: ["Google Shopping", (q, o) => "https://www.google.com/search?tbm=shop&q=" + enc(q) + googleTbs(o)],
  amazon: ["Amazon", (q, o) => "https://www.amazon.com/s?k=" + enc(q) + (o.max ? "&high-price=" + o.max : "")],
  walmart: ["Walmart", (q, o) => "https://www.walmart.com/search?q=" + enc(q) + (o.max ? "&max_price=" + o.max : "")],
  target: ["Target", q => "https://www.target.com/s?searchTerm=" + enc(q)],
  bestbuy: ["Best Buy", q => "https://www.bestbuy.com/site/searchpage.jsp?st=" + enc(q)],
  ebay: ["eBay", (q, o) => "https://www.ebay.com/sch/i.html?_nkw=" + enc(q) + (o.max ? "&_udhi=" + o.max : "") +
    (o.cond === "new" ? "&LH_ItemCondition=1000" : o.cond === "used" ? "&LH_ItemCondition=3000" : "")],
  web: ["Web search", q => "https://duckduckgo.com/?q=" + enc(q)]
};
const COND_IN_ADDRESS = new Set(["gshop", "ebay"]);  // other stores get the condition as a search word instead
const searchWords = o => [o.anyBrand ? "" : o.brand, o.name, o.words].map(x => (x || "").trim()).filter(Boolean).join(" ");
function storeUrl(key, o) {
  let q = searchWords(o);
  if (!COND_IN_ADDRESS.has(key) && (o.cond === "new" || o.cond === "used")) q += " " + o.cond;
  return STORES[key][1](q, o);
}
function findBlock(item) {
  return `<div class="find"><button type="button" class="small" data-act="find" aria-expanded="false">Find similar ↗</button>
    <div class="find-box" id="findBox" hidden>
      <div class="field"><label for="fs_brand">Brand</label><input id="fs_brand" value="${esc(item.brand)}" placeholder="e.g. KitchenAid"></div>
      <label class="toggle" style="font-size:13px"><input type="checkbox" id="fs_any"> Any brand (show alternatives)</label>
      <div class="field"><label for="fs_words">Model, size or color <span class="muted">(optional)</span></label><input id="fs_words" placeholder="e.g. 5 qt, red"></div>
      <div class="two"><div class="field"><label for="fs_cond">Condition</label><select id="fs_cond"><option value="any">Any</option><option value="new">New</option><option value="used">Used</option></select></div>
        <div class="field"><label for="fs_max">Max price ($)</label><input id="fs_max" type="number" min="0" step="1" placeholder="no limit"></div></div>
      <div class="sub" id="fs_preview"></div>
      <div class="stores">${Object.entries(STORES).map(([k, v]) => `<button type="button" class="small" data-store="${k}">${v[0]} ↗</button>`).join("")}</div>
      <div class="sub">Price limits apply on Google Shopping, Amazon, Walmart and eBay. Use the other stores' own filters.</div>
    </div></div>`;
}
function wireFind(pane, item) {
  const btn = pane.querySelector('[data-act="find"]'); if (!btn) return;
  const box = $("#findBox", pane);
  const opts = () => {
    const max = Math.ceil(Number($("#fs_max", pane).value) || 0);
    return {name: item.name, brand: $("#fs_brand", pane).value, anyBrand: $("#fs_any", pane).checked,
      words: $("#fs_words", pane).value, cond: $("#fs_cond", pane).value, max: max > 0 ? max : ""};
  };
  const preview = () => { $("#fs_preview", pane).innerHTML = "Searching for: <b>" + (esc(searchWords(opts())) || "—") + "</b>"; };
  btn.onclick = () => {
    box.hidden = !box.hidden; btn.setAttribute("aria-expanded", String(!box.hidden));
    if (!box.hidden) { preview(); $("#fs_words", pane).focus(); }
  };
  box.addEventListener("input", preview); box.addEventListener("change", preview);
  box.querySelectorAll("[data-store]").forEach(b => b.onclick = () =>
    window.open(storeUrl(b.dataset.store, opts()), "_blank", "noopener,noreferrer"));
}

/* ---------- pasted product link: read the page for a price ---------- */
const readLink = async url => { try { return await api("POST", "/link-info", {url}); } catch (e) { return {error: e.message}; } };
const usdPrice = i => i && i.price != null && (!i.currency || i.currency === "USD");
function linkBlock() {
  return `<div class="field"><label for="pl_url">Product link</label>
    <input id="pl_url" type="url" placeholder="Paste a product link to read its price" autocomplete="off"></div>
    <div class="sub idmsg" id="pl_msg" role="status"></div>`;
}
function wireLink(pane, item) {
  const inp = $("#pl_url", pane); if (!inp) return;
  const msg = $("#pl_msg", pane);
  let looked = "";  // the same link is never read twice, so clicking a result button can't wipe it
  const run = async () => {
    const url = inp.value.trim(); if (!url || url === looked) return;
    if (!safeUrl(url)) { setStatus(msg, "That doesn't look like a web link. It must start with http:// or https://", "err"); return; }
    looked = url; setStatus(msg, "Reading the page for a price…", "busy");
    const info = await readLink(url);
    const usd = usdPrice(info);
    msg.className = "sub idmsg";
    msg.innerHTML = (info.error ? `⚠ ${esc(info.error)}`
      : usd ? `✔ Found <b>${money(info.price)}</b> on ${esc(info.host)}${info.title ? " · " + esc(info.title.slice(0, 70)) : ""}`
      : info.price != null ? `Found ${esc(info.currency)} ${info.price} on ${esc(info.host)}. That isn't USD, so it won't be used automatically.`
      : "No price was found on that page. You can still save the link.") +
      `<div class="btns" style="margin-top:6px">${usd ? '<button type="button" class="small primary" data-use="both">Save link and set price</button>' : ""}
        <button type="button" class="small" data-use="link">Save link only</button></div>`;
    msg.querySelectorAll("[data-use]").forEach(b => b.onclick = async () => {
      const body = {similar_url: url};
      if (b.dataset.use === "both") body.replacement_value = info.price;
      try { await api("PUT", "/items/" + item.id, body); toast(b.dataset.use === "both" ? "Link and price saved" : "Link saved"); route(); }
      catch (e) { setStatus(msg, e.message, "err"); }
    });
  };
  inp.addEventListener("paste", () => setTimeout(run, 0));
  inp.addEventListener("change", run);
}

    const f = similarInp.files[0]; if (!f) return;
    const url = await readFile(f); imgs.similar = url;
    const p = $('[data-prev="similar"]', d); p.src = url; p.hidden = false;
  };
  const col = $(".photo-col", d);
  ["dragenter", "dragover"].forEach(ev => col.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  col.addEventListener("dragleave", () => drop.classList.remove("over"));
  col.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    const f = e.dataTransfer.files[0]; if (!f || !f.type.startsWith("image/")) return;
    const dt = new DataTransfer(); dt.items.add(f); photoInp.files = dt.files; photoInp.dispatchEvent(new Event("change"));
  });
  const autoBox = $("#idAuto", d);
  if (autoBox) {
    let v = "1"; try { v = localStorage.getItem("autoId") ?? "1"; } catch (e) {}
    autoBox.checked = v === "1";
    autoBox.onchange = () => { try { localStorage.setItem("autoId", autoBox.checked ? "1" : "0"); } catch (e) {} };
  }
  const photoData = async () => {
    if (imgs.photo) return imgs.photo;
    if (photoInp.files[0]) return readFile(photoInp.files[0]);  // chosen but still being read
    if (item?.image) return readFile(await (await fetch("/images/" + item.image)).blob());
    return null;
  };
  const msgEl = $("#idMsg", d);
  async function runId(provider) {
    const btns = d.querySelectorAll(".photo-col .btns button");
    const photo = await photoData();
    if (!photo) { setStatus(msgEl, "Add a photo first.", "err"); return; }
    if (provider === "anthropic" && !confirm("This sends the photo to Anthropic's Claude API using your own API key. Continue?")) return;
    btns.forEach(x => x.disabled = true);
    $("#busyText", d).textContent = provider === "ollama" ? `LLM working… (${model})` : "Claude working…";
    box.classList.add("busy"); box.setAttribute("aria-busy", "true");
    setStatus(msgEl, provider === "ollama" ? "The local model is reading the photo. This can take up to a minute." : "Asking Claude…", "busy");
    try {
      const r = await api("POST", "/identify", {data: await downscale(photo), provider});
      const set = (n, v) => { if (v) d.querySelector("#f_" + n).value = v; };
      set("name", r.name); set("brand", r.brand); set("item_type", r.item_type); set("description", r.description);
      identified = true;
      setStatus(msgEl, `Filled in by ${r.model}. Check it before saving.`, "ok");
    } catch (err) { setStatus(msgEl, err.message, "err"); }
    finally { btns.forEach(x => x.disabled = false); box.classList.remove("busy"); box.removeAttribute("aria-busy"); }
  }
  $("#idLocal", d).onclick = () => runId("ollama");
  const cl = $("#idCloud", d); if (cl) cl.onclick = () => runId("anthropic");

  /* a pasted link: read the page's price and offer it as the replacement price */
  const linkInp = d.querySelector("#f_similar_url"), repl = d.querySelector("#f_replacement_value"), linkMsg = $("#linkMsg", d);
  let looked = "";
  async function lookupLink() {
    const u = linkInp.value.trim();
    if (!u || u === looked) return;
    if (!safeUrl(u)) { setStatus(linkMsg, "That doesn't look like a web link. It must start with http:// or https://", "err"); return; }
    looked = u; setStatus(linkMsg, "Reading the page for a price…", "busy");
    const info = await readLink(u);
    if (info.error) { setStatus(linkMsg, info.error, "err"); return; }
    if (!usdPrice(info)) {
      setStatus(linkMsg, info.price != null ? `Found ${info.currency} ${info.price}, which isn't USD, so it wasn't used.`
        : "No price was found on that page. Enter it by hand."); return;
    }
    if (!repl.value.trim()) {
      repl.value = info.price.toFixed(2);
      setStatus(linkMsg, `Replacement price filled in from ${info.host}: ${money(info.price)}. Check it.`, "ok");
    } else {
      linkMsg.className = "sub idmsg";
      linkMsg.innerHTML = `Found ${money(info.price)} on ${esc(info.host)}. <button type="button" class="small" id="useLinkPrice">Use as replacement price</button>`;
      $("#useLinkPrice", d).onclick = () => { repl.value = info.price.toFixed(2); setStatus(linkMsg, "Replacement price updated.", "ok"); };
    }
  }
  linkInp.addEventListener("paste", () => setTimeout(lookupLink, 0));
  linkInp.addEventListener("change", lookupLink);

  if (item) {
    const del = document.createElement("button");
    del.type = "button"; del.className = "danger"; del.textContent = "Delete";
    del.onclick = async () => { if (!confirm(`Delete ${item.name}?`)) return;
      await api("DELETE", "/items/" + item.id); closeEditors(); sel.item = null; toast("Item deleted"); route(); };
    $(".form-actions", d).append(del);
  }
}

/* ---------- Add items by image: many photos and receipts, reviewed before anything is saved ---------- */
async function batchForm(room) {
  const cfg = await api("GET", "/settings");
  closeEditors();
  const panel = document.createElement("section");
  panel.className = "panel editor wide"; panel.id = "editor";
  panel.innerHTML = `<div class="panel-head"><h2>Add items by image</h2><span class="sub">Photos of items, or receipts. Nothing is saved until you review it.</span></div>
    <div class="ins-body">
      <div class="batch-pick">
        <label class="drop" id="bdrop" for="bFiles">${ICONS.camera}<b>Choose images</b><span>Drop up to 20 photos or receipts here, or click.</span></label>
        <input id="bFiles" class="sr-only" type="file" accept="image/*" multiple>
        <div class="batch-opts">
          <div class="field"><label for="bMode">These images are</label>
            <select id="bMode"><option value="auto">Mixed: detect each one</option><option value="item">All item photos</option><option value="receipt">All receipts</option></select></div>
          ${cfg.anthropic.configured ? '<label class="toggle" style="font-size:13px"><input type="checkbox" id="bCloud"> Use Claude instead of the local model (sends the images to Anthropic)</label>' : ""}
          <div class="btns"><button class="primary" type="button" id="bStart" disabled>Read images</button>
            <button type="button" id="bStop" hidden>Stop</button><button type="button" id="bClose">Close</button></div>
          <div class="sub idmsg" id="bNote" role="status">Receipts are best photographed flat, well lit and filling the frame.</div>
        </div>
      </div>
      <div class="bq" id="bQueue"></div>
      <div id="bReview" hidden></div>
    </div>`;
  app.prepend(panel);
  panel.onkeydown = e => { if (e.key === "Escape" && !running) panel.remove(); };
  const MAX_FILES = 20, itemTypes = META.item_types;
  let entries = [], cands = [], receipts = {}, nextId = 1, running = false, stop = false;

  const note = (t, k) => setStatus($("#bNote", panel), t, k);
  const startBtn = $("#bStart", panel);
  const addFiles = files => {
    const imgsOnly = [...files].filter(f => f.type.startsWith("image/"));
    const room_ = MAX_FILES - entries.length;
    imgsOnly.slice(0, room_).forEach(f => entries.push({id: nextId++, file: f, status: "Waiting", state: "wait", kind: null, dataUrl: null, thumb: ""}));
    note(imgsOnly.length > room_ ? `Only ${MAX_FILES} images at a time. The extra ones were skipped.`
      : files.length !== imgsOnly.length ? "Some files were skipped because they are not images." : `${entries.length} image${entries.length === 1 ? "" : "s"} ready.`,
      imgsOnly.length > room_ ? "err" : "");
    startBtn.disabled = !entries.some(e => e.state === "wait") || running;
    drawQueue();
    entries.filter(e => !e.thumb).forEach(async e => { try { e.thumb = await downscale(await readFile(e.file), 120); drawQueue(); } catch (x) {} });
  };
  $("#bFiles", panel).onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  const dz = $(".batch-pick", panel);
  ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); $("#bdrop", panel).classList.add("over"); }));
  dz.addEventListener("dragleave", () => $("#bdrop", panel).classList.remove("over"));
  dz.addEventListener("drop", e => { e.preventDefault(); $("#bdrop", panel).classList.remove("over"); addFiles(e.dataTransfer.files); });
  $("#bClose", panel).onclick = () => { if (!running || confirm("Stop reading and close?")) { stop = true; panel.remove(); } };
  $("#bStop", panel).onclick = () => { stop = true; note("Stopping after the current image…"); };

  function drawQueue() {
    $("#bQueue", panel).innerHTML = entries.map(e => `<div class="bq-item" data-id="${e.id}">
      ${e.thumb ? `<img class="thumb" src="${esc(e.thumb)}" alt="">` : '<div class="thumb"></div>'}
      <div class="bq-main"><b>${esc(e.file.name)}</b>
        <div class="sub ${e.state === "err" ? "err-text" : ""}">${e.state === "busy" ? '<span class="spin" aria-hidden="true"></span> ' : e.state === "err" ? "⚠ " : e.state === "done" ? "✔ " : ""}${esc(e.status)}</div></div>
      <div class="btns">${e.state === "done" || e.state === "err" ? `<button type="button" class="small" data-redo="${e.id}:${e.kind === "receipt" ? "item" : "receipt"}">${e.kind === "receipt" ? "Read as item" : "Read as receipt"}</button>` : ""}
        ${e.state === "wait" ? `<button type="button" class="small" data-drop="${e.id}" aria-label="Remove ${esc(e.file.name)}">✕</button>` : ""}</div></div>`).join("");
    $("#bQueue", panel).querySelectorAll("[data-drop]").forEach(b => b.onclick = () => {
      entries = entries.filter(x => x.id !== +b.dataset.drop); startBtn.disabled = !entries.some(e => e.state === "wait"); drawQueue();
    });
    $("#bQueue", panel).querySelectorAll("[data-redo]").forEach(b => b.onclick = async () => {
      if (running) { note("Wait for the current run to finish.", "err"); return; }
      const [id, kind] = b.dataset.redo.split(":"), e = entries.find(x => x.id === +id);
      cands = cands.filter(c => c.entry !== e.id); delete receipts[e.id];
      e.state = "wait"; e.status = "Waiting"; e.forced = kind; await run([e]);
    });
  }

  const cloudOn = () => !!($("#bCloud", panel) && $("#bCloud", panel).checked);
  async function process(e) {
    const provider = cloudOn() ? "anthropic" : "ollama";
    const set = (s, st) => { e.status = s; e.state = st || e.state; drawQueue(); };
    try {
      set("Preparing…", "busy");
      const url = await readFile(e.file);
      let kind = e.forced || $("#bMode", panel).value;
      if (kind === "auto") {
        set("LLM working: is this a receipt or an item?");
        kind = (await api("POST", "/classify", {data: await downscale(url, 768), provider})).kind;
      }
      e.kind = kind;
      if (kind === "receipt") {
        set("LLM working: reading the receipt…");
        const r = await api("POST", "/receipt", {data: await downscale(url, 1800), provider});
        receipts[e.id] = r;
        r.items.forEach(it => cands.push({entry: e.id, kind: "receipt", name: it.description, brand: "", item_type: itemTypes.includes(it.category) ? it.category : "",
          qty: it.quantity, price: it.unit_price ?? "", description: `From receipt: ${[r.store, r.date].filter(Boolean).join(" · ")}`,
          checked: itemTypes.includes(it.category), photo: null, thumb: ""}));
        set(`Receipt${r.store ? " from " + r.store : ""}: ${r.items.length} line${r.items.length === 1 ? "" : "s"} found`, "done");
      } else if (kind === "item") {
        set("LLM working: identifying the item…");
        const r = await api("POST", "/identify", {data: await downscale(url, 1024), provider});
        cands.push({entry: e.id, kind: "item", name: r.name, brand: r.brand, item_type: r.item_type || "", qty: 1, price: "",
          description: r.description, checked: true, photo: url, thumb: e.thumb});
        set(`Item: ${r.name}`, "done");
      } else set("Skipped: not an item or a receipt", "done");
    } catch (err) { set(err.message, "err"); }
  }
  async function run(list) {
    running = true; stop = false; startBtn.disabled = true; $("#bStop", panel).hidden = false;
    const pool = cloudOn() ? 3 : 1, queue = list.filter(e => e.state === "wait");
    const worker = async () => { while (queue.length && !stop) await process(queue.shift()); };
    await Promise.all(Array.from({length: pool}, worker));
    running = false; $("#bStop", panel).hidden = true;
    startBtn.disabled = !entries.some(e => e.state === "wait");
    note(stop ? "Stopped. Unread images are still listed." : `Done. ${cands.length} possible item${cands.length === 1 ? "" : "s"} found. Review them below.`, stop ? "" : "ok");
    drawReview();
  }
  startBtn.onclick = () => {
    if (cloudOn() && !confirm(`This sends ${entries.filter(e => e.state === "wait").length} image(s) to Anthropic's Claude API using your own API key. Receipts can show card digits and addresses. Continue?`)) return;
    run(entries);
  };

  function drawReview() {
    const box = $("#bReview", panel); box.hidden = !cands.length; if (!cands.length) return;
    const groups = [];
    for (const e of entries) {
      const rows = cands.map((c, i) => [c, i]).filter(([c]) => c.entry === e.id);
      if (rows.length) groups.push({e, rows, r: receipts[e.id]});
    }
    box.innerHTML = `<h3 class="subhead" style="margin:4px 0 8px">Review</h3><div class="table-wrap"><table class="rv"><thead><tr><th></th><th>Name</th><th>Brand</th><th>Type</th><th class="num">Qty</th><th class="num">Price ($)</th></tr></thead><tbody>` +
      groups.map(g => (g.r ? `<tr class="rv-head"><td colspan="6"><b>Receipt${g.r.store ? " · " + esc(g.r.store) : ""}${g.r.date ? " · " + esc(g.r.date) : ""}</b>${g.r.total ? " · total " + money(g.r.total) : ""}
          ${g.r.warnings.map(w => `<div class="sub err-text">⚠ ${esc(w)}</div>`).join("")}
          <div class="sub">Lines that look like food or supplies are unticked. Tick any you want to keep.</div></td></tr>` : "") +
        g.rows.map(([c, i]) => `<tr data-i="${i}"><td><input type="checkbox" data-f="checked" ${c.checked ? "checked" : ""} aria-label="Include ${esc(c.name)}"></td>
          <td>${c.thumb ? `<img class="thumb sm" src="${esc(c.thumb)}" alt="">` : ""}<input data-f="name" value="${esc(c.name)}" aria-label="Name"></td>
          <td><input data-f="brand" value="${esc(c.brand)}" aria-label="Brand"></td>
          <td><select data-f="item_type" aria-label="Type"><option value="">—</option>${itemTypes.map(t => `<option ${t === c.item_type ? "selected" : ""}>${t}</option>`).join("")}</select></td>
          <td class="num"><input data-f="qty" type="number" min="1" max="25" value="${esc(c.qty)}" aria-label="Quantity"></td>
          <td class="num"><input data-f="price" type="number" min="0" step="0.01" value="${esc(c.price)}" aria-label="Price"></td></tr>`).join("")).join("") +
      `</tbody></table></div><div class="btns" style="margin-top:10px"><button class="primary" type="button" id="bSave"></button>
        <span class="sub idmsg" id="bSaveMsg" role="status"></span></div>`;
    const count = () => cands.filter(c => c.checked && !c.saved).reduce((n, c) => n + Math.min(25, Math.max(1, +c.qty || 1)), 0);
    const refresh = () => { const n = count(); const b = $("#bSave", panel); b.textContent = n ? `Add ${n} item${n === 1 ? "" : "s"} to ${room.name}` : "Nothing selected"; b.disabled = !n; };
    box.querySelectorAll("tr[data-i]").forEach(tr => {
      const c = cands[+tr.dataset.i];
      tr.addEventListener("input", ev => { const f = ev.target.dataset.f; if (!f) return; c[f] = f === "checked" ? ev.target.checked : ev.target.value; refresh(); });
      tr.addEventListener("change", ev => { const f = ev.target.dataset.f; if (f === "checked") { c.checked = ev.target.checked; refresh(); } });
    });
    refresh();
    $("#bSave", panel).onclick = async () => {
      const msg = $("#bSaveMsg", panel), btn = $("#bSave", panel);
      const picks = cands.filter(c => c.checked && !c.saved);
      if (picks.some(c => !String(c.name).trim())) { setStatus(msg, "Every ticked line needs a name.", "err"); return; }
      btn.disabled = true; let made = 0;
      try {
        for (const c of picks) {
          const qty = Math.min(25, Math.max(1, +c.qty || 1));
          for (let k = 0; k < qty; k++) {
            setStatus(msg, `Saving ${made + 1}…`, "busy");
            const it = await api("POST", `/rooms/${room.id}/items`, {name: c.name.trim(), brand: (c.brand || "").trim(), item_type: c.item_type,
              description: c.description || "", purchased_value: c.price === "" ? "" : c.price, source: "vision"});
            if (c.photo && k === 0) await api("POST", `/items/${it.id}/image?kind=photo`, {data: await downscale(c.photo, 1600)});
            made++;
          }
          c.saved = true;
        }
        sel.item = null; toast(`Added ${made} item${made === 1 ? "" : "s"}`); route();
      } catch (err) { setStatus(msg, `${err.message} (${made} saved so far; fix this and try again.)`, "err"); refresh(); }
    };
  }
  panel.scrollIntoView({block: "nearest"});
}

/* ---------- router ---------- */
async function route() {
  closeEditors();
  const [, kind, id] = location.hash.split("/");
  try {
    if (kind === "home") await homeView(+id);
    else if (kind === "room") await roomView(+id);
    else if (kind === "settings") await settingsView();
    else await homesView();
  } catch (e) {
    chrome("Not found", null);
    app.innerHTML = `<div class="panel"><div class="empty">${esc(e.message)}. <a href="#/">Back to homes</a></div></div>`;
  }
}
window.addEventListener("hashchange", route);
api("GET", "/meta").then(m => { META = m; }).finally(route);
</script>
