<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Inventory</title>
<link rel="stylesheet" href="ds/tokens/tokens.css">
<link rel="stylesheet" href="ds/base/base.css">
<link rel="stylesheet" href="ds/components/shell/shell.css">
<link rel="stylesheet" href="ds/components/status/status.css">
<link rel="stylesheet" href="ds/components/panel/panel.css">
<link rel="stylesheet" href="ds/components/card/card.css">
<style>
/* App-specific layout only; every colour, radius and font comes from the design system tokens. */
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--accent)}
.lead{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{cursor:pointer;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile h3{margin:0;font-size:15px}
.tile .btns{margin-top:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.small{padding:2px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);display:block}
.sub{color:var(--muted);font-size:12px}
.preview{max-width:100%;max-height:160px;border-radius:var(--r-sm);border:1px solid var(--line)}
dialog.modal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);padding:20px;width:min(520px,94vw);max-height:92vh;text-align:left}
dialog.modal::backdrop{background:rgba(10,14,20,.4)}
dialog.modal h3{margin:0 0 6px}
dialog.modal .field{margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);min-height:1.2em;margin-top:8px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--head);color:var(--head-text);
  padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.top h1{font-size:18px}
/* density toggle */
.seg{display:inline-flex}
.seg button{border-radius:0;padding:4px 10px;font-size:12px}
.seg button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.seg button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
/* two-pane room layout: item pane on the left, list on the right */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.pane{position:sticky;top:72px}
.pane-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.pane h3{margin:0;font-size:16px}
.pane h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2)}
.ph.sm{aspect-ratio:16/9}
.ph-empty{display:grid;place-items:center;height:84px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:13px}
.ph-empty.sm{height:64px}
.pane dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.pane dt{color:var(--muted)}
.pane dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pane .desc{font-size:13px;color:var(--muted);white-space:pre-wrap}
.pane .links a{word-break:break-all}
.flags{display:flex;flex-direction:column;gap:4px;font-size:13px}
.flags div{display:flex;gap:8px;align-items:center}
/* status icons: photo / equivalent link / price */
.ico{display:inline-flex;gap:5px;align-items:center}
.ic{display:inline-flex}
.ic svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.ic.yes,.ic.current{color:var(--green)}
.ic.stale{color:var(--amber)}
.ic.no,.ic.none{color:var(--grey);opacity:.6}
.ic.no .g,.ic.none .g{stroke-dasharray:2 2}
.ic .bd{fill:currentColor;stroke:none}
.ic .bk{stroke:var(--on-status);stroke-width:1.2}
/* item and room tables */
tr[data-id]{cursor:pointer}
.inv{white-space:nowrap;color:var(--muted);font-size:12px}
tbody tr[data-id]:hover{background:var(--surface-2)}
tr.sel,tr.sel:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 3px 0 0 var(--accent)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.legend{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
/* density */
html[data-density="compact"] th,html[data-density="compact"] td{padding:3px 10px;font-size:13px}
html[data-density="compact"] .thumb{width:24px;height:24px;border-radius:4px}
html[data-density="compact"] .ic svg{width:14px;height:14px}
html[data-density="compact"] .sub{display:inline;margin-left:6px}
html[data-density="compact"] td .btns button{padding:0 8px}
/* insurance */
.ins>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px}
.ins>summary::-webkit-details-marker{display:none}
.ins>summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s}
.ins[open]>summary::before{transform:rotate(90deg)}
.ins>summary h2{margin:0}
.ins .peek{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins[open]>summary{border-bottom:1px solid var(--line)}
.ins-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.ins-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.ins-grid .full{grid-column:1/-1}
.cov{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-size:13px}
.cov.ok{border-color:var(--green)}
.cov.gap{border-color:var(--amber)}
.cov b{white-space:nowrap}
@media(max-width:1000px){.split{grid-template-columns:1fr}.pane{position:static}.ins-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.two,.ins-grid{grid-template-columns:1fr}.top{padding:10px 14px}main{padding:12px 14px 50px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Home Inventory</div>
    <nav aria-label="Homes" id="nav"></nav>
    <div class="side-foot"><div class="who">Saved on this computer<small>No account, no cloud</small></div>
      <button id="theme" type="button"></button></div>
  </aside>
  <div class="content">
    <header class="top"><h1 id="title">Homes</h1>
      <div class="top-actions">
        <div class="seg" role="group" aria-label="List density">
          <button type="button" data-d="comfortable">Comfortable</button><button type="button" data-d="compact">Compact</button></div>
        <button class="primary" id="add" type="button" hidden></button></div></header>
    <main id="app"></main>
  </div>
</div>
<dialog id="dlg" class="modal"></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n || 0).toLocaleString(undefined, {style:"currency", currency:"USD"});
let META = {item_types: [], room_templates: {}};

async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method, headers: {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}
const readFile = f => new Promise((ok, no) => {
  const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f);
});

/* ---------- theme: Auto / Light / Dark ---------- */
const THEMES = ["auto", "light", "dark"];
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $("#theme").textContent = "◐ Theme: " + t[0].toUpperCase() + t.slice(1);
}
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
if (!THEMES.includes(theme)) theme = "auto";
applyTheme(theme);
$("#theme").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("theme", theme); } catch (e) {}
  applyTheme(theme);
};

/* ---------- density: comfortable / compact ---------- */
let density = "comfortable";
try { density = localStorage.getItem("density") || "comfortable"; } catch (e) {}
function applyDensity(d) {
  density = d === "compact" ? "compact" : "comfortable";
  document.documentElement.setAttribute("data-density", density);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === density)));
}
applyDensity(density);
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  try { localStorage.setItem("density", b.dataset.d); } catch (e) {}
  applyDensity(b.dataset.d);
});

/* ---------- status icons and helpers ---------- */
const GLYPH = {
  photo: '<rect class="g" x="1.5" y="4" width="11" height="8.5" rx="2"/><circle class="g" cx="7" cy="8.2" r="2"/><path class="g" d="M4.6 4l.9-1.6h3l.9 1.6"/>',
  link: '<path class="g" d="M6.3 8.7l2.4-2.4"/><path class="g" d="M5.6 7.1L4.4 8.3a2.3 2.3 0 003.3 3.3l1.2-1.2"/><path class="g" d="M9.6 7.5l1.2-1.2a2.3 2.3 0 00-3.3-3.3L6.3 4.2"/>',
  price: '<path class="g" d="M1.5 8V2.5H7l6 6-5.5 5.5z"/><circle class="g" cx="4.7" cy="5.7" r=".9"/>'
};
const LABELS = {
  photo: {yes: "Photo added", no: "No photo"},
  link: {yes: "Equivalent-item link added", no: "No equivalent-item link"}
};
function icon(kind, state, label) {
  const good = state === "yes" || state === "current";
  const badge = good ? '<circle class="bd" cx="12.2" cy="12.2" r="3.6"/><path class="bk" d="M10.4 12.3l1.3 1.2 2.1-2.4"/>'
    : state === "stale" ? '<circle class="bd" cx="12.2" cy="12.2" r="3.6"/><path class="bk" d="M12.2 10.4v2M12.2 13.9v.1"/>' : "";
  return `<span class="ic ${state}" role="img" aria-label="${esc(label)}" title="${esc(label)}"><svg viewBox="0 0 16 16" aria-hidden="true">${GLYPH[kind]}${badge}</svg></span>`;
}
const PRICE_STALE_DAYS = 365;
function priceState(i) {
  if (!i.price_updated_at) return "none";
  return (Date.now() - Date.parse(i.price_updated_at)) / 864e5 > PRICE_STALE_DAYS ? "stale" : "current";
}
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"}) : "";
function priceLabel(i) {
  const st = priceState(i);
  return st === "none" ? "Price never updated"
    : st === "stale" ? "Price last updated " + fmtDate(i.price_updated_at) + " (over a year ago)"
    : "Price updated " + fmtDate(i.price_updated_at);
}
function itemIcons(i) {
  const ps = priceState(i);
  return `<span class="ico">${icon("photo", i.image ? "yes" : "no", i.image ? LABELS.photo.yes : LABELS.photo.no)}` +
    `${icon("link", i.similar_url ? "yes" : "no", i.similar_url ? LABELS.link.yes : LABELS.link.no)}` +
    `${icon("price", ps, priceLabel(i))}</span>`;
}
const safeUrl = u => /^https?:\/\/\S+$/i.test(u || "") ? u : null;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };

/* ---------- dialog helper ---------- */
function form(title, html, onSubmit, {submit = "Save"} = {}) {
  const d = $("#dlg");
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${html}
    <div class="err" role="alert"></div>
    <div class="dlg-actions"><button type="button" data-x>Cancel</button>
    <button class="primary">${esc(submit)}</button></div></form>`;
  $("[data-x]", d).onclick = () => d.close();
  $("form", d).onsubmit = async e => {
    e.preventDefault();
    try { await onSubmit($("form", d)); d.close(); }
    catch (err) { $(".err", d).textContent = err.message; }
  };
  d.showModal();
  const first = $("input,select,textarea", d); if (first) first.focus();
}
const field = (name, label, v = "", attrs = "") =>
  `<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" value="${esc(v)}" ${attrs}></div>`;
const area = (name, label, v = "") =>
  `<div class="field"><label for="f_${name}">${esc(label)}</label><textarea id="f_${name}" name="${name}" rows="2">${esc(v)}</textarea></div>`;
const select = (name, label, opts, cur, blank) =>
  `<div class="field"><label for="f_${name}">${esc(label)}</label><select id="f_${name}" name="${name}">` +
  (blank ? `<option value="">${esc(blank)}</option>` : "") +
  opts.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(t)}</option>`).join("") +
  `</select></div>`;
const val = (f, n) => f.elements[n].value;

/* ---------- chrome: sidebar nav, title, primary action ---------- */
const app = $("#app");
async function buildNav(homeId, roomId, settings = false) {
  const homes = await api("GET", "/homes");
  const rooms = await Promise.all(homes.map(h => api("GET", `/homes/${h.id}/rooms`)));
  $("#nav").innerHTML = `<a href="#/" ${homeId == null && !settings ? 'aria-current="page"' : ""}>All homes</a><hr>` +
    homes.map((h, i) => {
      const open = h.id === homeId;
      return `<div class="nav-group"><div class="nav-row">
        <a href="#/home/${h.id}" ${open && roomId == null ? 'aria-current="page"' : ""}>${esc(h.name)}<span class="nav-count">${rooms[i].length}</span></a>
        <button class="nav-toggle" type="button" aria-expanded="${open}" aria-label="Toggle ${esc(h.name)} rooms"><span aria-hidden="true">▸</span></button></div>
        <ul class="nav-items" ${open ? "" : "hidden"}>${rooms[i].length ? rooms[i].map(r =>
          `<li><a class="nav-item" href="#/room/${r.id}" ${r.id === roomId ? 'aria-current="true"' : ""}><span class="nm">${esc(r.name)}</span></a></li>`).join("")
          : '<li class="nav-empty">No rooms yet</li>'}</ul></div>`;
    }).join("") + `<hr><a href="#/settings" ${settings ? 'aria-current="page"' : ""}>Settings</a>`;
  $("#nav").querySelectorAll(".nav-toggle").forEach(b => b.onclick = () => {
    const ul = b.closest(".nav-group").querySelector(".nav-items");
    ul.hidden = !ul.hidden; b.setAttribute("aria-expanded", String(!ul.hidden));
  });
}
function chrome(title, addLabel, onAdd) {
  $("#title").textContent = title; document.title = title + " · Home Inventory";
  const b = $("#add"); b.hidden = !addLabel; b.textContent = addLabel || ""; b.onclick = onAdd || null;
}
const stats = list => `<div class="stats">${list.map(([k, v]) => `<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join("")}</div>`;

/* ---------- views ---------- */
async function homesView() {
  const homes = await api("GET", "/homes");
  await buildNav(null, null);
  chrome("Homes", "+ Add home", () => homeForm());
  app.innerHTML = homes.length ? `<div class="grid">${homes.map(h => `
      <div class="card tile" data-id="${h.id}">
        <h3>${esc(h.name)}</h3><div class="sub">${esc(h.address || "No address")}</div>
        <div>${h.room_count} rooms · ${h.item_count} items</div>
        <div class="muted">Replacement value <b style="color:var(--text)">${money(h.total_replacement)}</b></div>
        <div class="btns"><button class="small" data-edit="${h.id}">Edit</button>
        <button class="small danger" data-del="${h.id}">Delete</button></div>
      </div>`).join("")}</div>`
    : `<div class="panel"><div class="empty">No homes yet. Add your first home to start cataloging. Everything stays on this computer.</div></div>`;
  app.querySelectorAll(".tile").forEach(c => c.onclick = e => {
    if (e.target.closest("button")) return; location.hash = "#/home/" + c.dataset.id; });
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () =>
    homeForm(homes.find(h => h.id == b.dataset.edit)));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const h = homes.find(h => h.id == b.dataset.del);
    if (!confirm(`Delete "${h.name}" with its ${h.room_count} rooms and ${h.item_count} items?`)) return;
    await api("DELETE", "/homes/" + h.id); toast("Home deleted"); route();
  });
}
function homeForm(h) {
  form(h ? "Edit home" : "Add home",
    field("name", "Name", h?.name, "required") + field("address", "Address (optional)", h?.address),
    async f => { const b = {name: val(f, "name"), address: val(f, "address")};
      h ? await api("PUT", "/homes/" + h.id, b) : await api("POST", "/homes", b); route(); });
}

async function homeView(id) {
  const [home, rooms, ins] = await Promise.all([api("GET", "/homes/" + id), api("GET", `/homes/${id}/rooms`), api("GET", `/homes/${id}/insurance`)]);
  await buildNav(id, null);
  chrome(home.name, "+ Add room", () => roomAddForm(id));
  const tp = rooms.reduce((s, r) => s + r.total_purchased, 0), tr = rooms.reduce((s, r) => s + r.total_replacement, 0);
  app.innerHTML = `<div class="crumbs"><a href="#/">Homes</a> / ${esc(home.name)}${home.address ? " · " + esc(home.address) : ""}</div>
    ${stats([["Rooms", home.room_count], ["Items", home.item_count],
      ["Purchased", money(home.total_purchased)], ["Home value (replacement)", money(home.total_replacement)]])}
    <section class="panel"><div class="panel-head"><h2>Rooms</h2></div>
    ${rooms.length ? `<div class="table-wrap"><table><thead><tr><th>Room</th><th class="num">Items</th>
      <th class="num">Purchased</th><th class="num">Replacement</th><th></th></tr></thead><tbody>
      ${rooms.map(r => `<tr data-id="${r.id}" tabindex="0">
        <td><b>${esc(r.name)}</b>${r.description ? `<div class="sub">${esc(r.description)}</div>` : ""}</td>
        <td class="num">${r.item_count}</td><td class="num">${money(r.total_purchased)}</td><td class="num">${money(r.total_replacement)}</td>
        <td><div class="btns"><button class="small" data-edit="${r.id}">Edit / move</button>
        <button class="small danger" data-del="${r.id}">Delete</button></div></td></tr>`).join("")}
      </tbody><tfoot><tr><td>Home total</td><td class="num">${rooms.reduce((s, r) => s + r.item_count, 0)}</td>
        <td class="num">${money(tp)}</td><td class="num">${money(tr)}</td><td></td></tr></tfoot></table></div>`
      : `<div class="empty">No rooms yet. Add one. Common rooms can be pre-filled with typical items.</div>`}</section>
    ${insuranceSection(home, ins)}`;
  const go = tr => { location.hash = "#/room/" + tr.dataset.id; };
  app.querySelectorAll("tbody tr[data-id]").forEach(tr => {
    tr.onclick = e => { if (!e.target.closest("button")) go(tr); };
    tr.onkeydown = e => { if (e.key === "Enter" && e.target === tr) go(tr); };
  });
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () =>
    roomEditForm(rooms.find(r => r.id == b.dataset.edit)));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const r = rooms.find(r => r.id == b.dataset.del);
    if (!confirm(`Delete room "${r.name}" and its ${r.item_count} items?`)) return;
    await api("DELETE", "/rooms/" + r.id); toast("Room deleted"); route();
  });
  wireInsurance(home);
}

/* ---------- home insurance (optional) ---------- */
let insOpen = false;
function insuranceSummary(ins) {
  if (!ins.configured) return "Not set up. Add policy and coverage details.";
  return [ins.insurer, ins.contents_coverage != null ? "Contents " + money(ins.contents_coverage) : "",
    ins.renewal_date ? "Renews " + ins.renewal_date : ""].filter(Boolean).join(" · ") || "Saved";
}
function coverageNote(home, ins) {
  const out = [];
  if (ins.configured && ins.contents_coverage != null) {
    const diff = ins.contents_coverage - home.total_replacement;
    out.push(diff >= 0
      ? `<div class="cov ok"><span aria-hidden="true">✔</span><div><b>Contents coverage is enough.</b> ${money(ins.contents_coverage)} covers the ${money(home.total_replacement)} replacement value, with ${money(diff)} to spare.</div></div>`
      : `<div class="cov gap"><span aria-hidden="true">⚠</span><div><b>Contents coverage is short by ${money(-diff)}.</b> The inventory's replacement value is ${money(home.total_replacement)} but coverage is ${money(ins.contents_coverage)}.</div></div>`);
  } else if (ins.configured) {
    out.push(`<div class="cov"><span aria-hidden="true">ℹ</span><div>Add a contents coverage amount to compare it with the ${money(home.total_replacement)} replacement value.</div></div>`);
  }
  if (ins.renewal_date && ins.renewal_date < new Date().toISOString().slice(0, 10))

/* shrink a photo before sending it to a model: smaller upload, faster answer */
const downscale = (url, max = 1024) => new Promise((ok, no) => {
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.85));
  };
  im.onerror = () => no(new Error("Could not read that image"));
  im.src = url;
});

        <div class="btns" style="margin-top:6px"><button class="small" data-pick="similar">${item.similar_image ? "Replace image" : "Add image"}</button></div></div>

      <div class="flags"><div>${icon("photo", item.image ? "yes" : "no", item.image ? LABELS.photo.yes : LABELS.photo.no)}<span>${item.image ? LABELS.photo.yes : LABELS.photo.no}</span></div>

function pickImage(itemId, kind) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    try { await api("POST", `/items/${itemId}/image?kind=${kind}`, {data: await readFile(inp.files[0])}); toast("Image saved"); route(); }
    catch (err) { toast(err.message); }
  };
  inp.click();
}

async function roomView(id) {
  const room = await api("GET", "/rooms/" + id);
  const [home, items] = await Promise.all([api("GET", "/homes/" + room.home_id), api("GET", `/rooms/${id}/items`)]);
  await buildNav(home.id, room.id);
  chrome(room.name, "+ Add item", () => itemForm(room));
  if (sel.room !== id) { sel.room = id; sel.item = null; }
  if (!items.some(i => i.id === sel.item)) sel.item = null;
  app.innerHTML = `<div class="crumbs"><a href="#/">Homes</a> / <a href="#/home/${home.id}">${esc(home.name)}</a> / ${esc(room.name)}${room.description ? " · " + esc(room.description) : ""}</div>
    ${stats([["Items", items.length], ["Purchased", money(room.total_purchased)], ["Room total (replacement)", money(room.total_replacement)],
      ["Home total", money(home.total_replacement)]])}
    <div class="split"><aside class="panel pane" id="pane" aria-label="Selected item"></aside>
    <section class="panel"><div class="panel-head"><h2>Items</h2></div>
    ${items.length ? `<div class="table-wrap"><table><thead><tr><th aria-label="Photo"></th><th>Item</th><th>Inv #</th>
      <th>Status</th><th class="num">Purchased</th><th class="num">Replacement</th></tr></thead><tbody>
      ${items.map(i => `<tr data-id="${i.id}" tabindex="0" aria-selected="${i.id === sel.item}" class="${i.id === sel.item ? "sel" : ""}">
        <td>${i.image ? `<img class="thumb" src="/images/${esc(i.image)}" alt="">` : `<div class="thumb"></div>`}</td>
        <td><b>${esc(i.name)}</b>${i.brand || i.item_type ? `<div class="sub">${esc([i.brand, i.item_type].filter(Boolean).join(" · "))}</div>` : ""}</td>
        <td class="inv">${esc(i.inv_no)}</td>
        <td>${itemIcons(i)}</td>
        <td class="num">${money(i.purchased_value)}</td><td class="num">${money(i.replacement_value)}</td></tr>`).join("")}
      </tbody><tfoot><tr><td colspan="4">Room total (${items.length} items)</td>
        <td class="num">${money(room.total_purchased)}</td><td class="num">${money(room.total_replacement)}</td></tr></tfoot></table></div>
      <div class="legend"><span>${icon("photo", "yes", "Photo")} photo</span><span>${icon("link", "yes", "Link")} equivalent-item link</span>
        <span>${icon("price", "current", "Price")} price updated within a year</span><span>${icon("price", "stale", "Price")} older than a year</span>
        <span>${icon("price", "none", "Price")} never updated · dashed = missing</span></div>`
      : `<div class="empty">No items in this room yet.</div>`}</section></div>`;
  const pane = $("#pane");
  const show = () => {
    const item = items.find(i => i.id === sel.item) || null;
    pane.innerHTML = paneHtml(item);
    pane.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pickImage(item.id, b.dataset.pick));
    const ed = pane.querySelector('[data-act="edit"]'); if (ed) ed.onclick = () => itemForm(room, item);
    const cf = pane.querySelector('[data-act="confirm"]');
    if (cf) cf.onclick = async () => { await api("PUT", "/items/" + item.id, {price_confirmed: true}); toast("Price marked current"); route(); };
    app.querySelectorAll("tbody tr[data-id]").forEach(tr => {
      const on = +tr.dataset.id === sel.item;
      tr.classList.toggle("sel", on); tr.setAttribute("aria-selected", String(on));
    });
  };
  app.querySelectorAll("tbody tr[data-id]").forEach(tr => {
    const pick = () => { sel.item = +tr.dataset.id; show(); };
    tr.onclick = pick;
    tr.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
  });
  show();
}

async function itemForm(room, item) {
  const [rooms, cfg] = await Promise.all([api("GET", `/homes/${room.home_id}/rooms`), api("GET", "/settings")]);
  const imgs = {photo: null, similar: null};
  let identified = false;
  const img = (kind, label, cur) => `<div class="field"><label for="f_img_${kind}">${label}</label>
    <input id="f_img_${kind}" type="file" accept="image/*" data-kind="${kind}">
    <img class="preview" data-prev="${kind}" ${cur ? `src="/images/${esc(cur)}"` : "hidden"} alt=""></div>`;
  form(item ? `Edit ${item.inv_no}` : "Add item",
    field("name", "Name", item?.name, "required") +
    `<div class="two">${field("brand", "Brand", item?.brand)}${select("item_type", "Type", META.item_types.map(t => [t, t]), item?.item_type, "— choose —")}</div>` +
    area("description", "Description", item?.description) +
    `<div class="two">${field("purchased_value", "Purchased value ($)", item?.purchased_value ?? "", 'type="number" min="0" step="0.01"')}
      ${field("replacement_value", "Replacement value ($)", item?.replacement_value ?? "", 'type="number" min="0" step="0.01" placeholder="defaults to purchased"')}</div>` +
    field("similar_url", "Link to a similar item", item?.similar_url, 'type="url" placeholder="https://"') +
    img("photo", "Photo", item?.image) +
    `<div class="field" id="idBlock"><div class="btns">
       <button type="button" class="small" id="idLocal">Identify with ${esc(cfg.ollama.model)}</button>
       ${cfg.anthropic.configured ? '<button type="button" class="small" id="idCloud">Identify with Claude…</button>'
         : '<span class="sub">Want Claude instead? <a href="#/settings" onclick="$(\'#dlg\').close()">Add your key in Settings</a></span>'}</div>
       <div class="sub" id="idMsg" role="status">Choose a photo, then let a model fill in the name, brand and type. You review before saving.</div>
       <a id="idSearch" class="sub" target="_blank" rel="noopener noreferrer" hidden>Search for an equivalent item ↗</a></div>` +
    img("similar", "Image of similar item", item?.similar_image) +
    (item ? select("room_id", "Room", rooms.map(r => [r.id, r.name]), item.room_id) : ""),
    async f => {
      const b = {name: val(f, "name"), brand: val(f, "brand"), item_type: val(f, "item_type"),
        description: val(f, "description"), similar_url: val(f, "similar_url"),
        purchased_value: val(f, "purchased_value"), replacement_value: val(f, "replacement_value")};
      if (item) b.room_id = +val(f, "room_id"); else if (identified) b.source = "vision";
      const saved = item ? await api("PUT", "/items/" + item.id, b) : await api("POST", `/rooms/${room.id}/items`, b);
      for (const k of ["photo", "similar"])
        if (imgs[k]) await api("POST", `/items/${saved.id}/image?kind=${k}`, {data: imgs[k]});
      sel.item = saved.id; toast("Item saved"); route();
    });
  const d = $("#dlg");
  d.querySelectorAll("input[type=file]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const url = await readFile(f); imgs[inp.dataset.kind] = url;
    const p = $(`[data-prev=${inp.dataset.kind}]`, d); p.src = url; p.hidden = false;
  });
  const photoData = async () => {
    if (imgs.photo) return imgs.photo;
    const chosen = d.querySelector('input[data-kind="photo"]').files[0];
    if (chosen) return readFile(chosen);  // chosen but still being read
    if (item?.image) return readFile(await (await fetch("/images/" + item.image)).blob());
    return null;
  };
  async function runId(provider) {
    const msg = $("#idMsg", d), btns = d.querySelectorAll("#idBlock button");
    const photo = await photoData();
    if (!photo) { msg.textContent = "Choose a photo first."; return; }
    if (provider === "anthropic" && !confirm("This sends the photo to Anthropic's Claude API using your own API key. Continue?")) return;
    btns.forEach(x => x.disabled = true);
    msg.textContent = provider === "ollama" ? "Identifying with the local model… this can take up to a minute." : "Asking Claude…";
    try {
      const r = await api("POST", "/identify", {data: await downscale(photo), provider});
      const set = (n, v) => { if (v) d.querySelector("#f_" + n).value = v; };
      set("name", r.name); set("brand", r.brand); set("item_type", r.item_type); set("description", r.description);
      identified = true;
      msg.textContent = `Filled in by ${r.model}. Check it before saving.`;
      const a = $("#idSearch", d);
      if (r.search_query) { a.href = "https://duckduckgo.com/?q=" + encodeURIComponent(r.search_query); a.hidden = false; }
    } catch (err) { msg.textContent = err.message; }
    finally { btns.forEach(x => x.disabled = false); }
  }
  $("#idLocal", d).onclick = () => runId("ollama");
  const cl = $("#idCloud", d); if (cl) cl.onclick = () => runId("anthropic");
  if (item) {
    const del = document.createElement("button");
    del.type = "button"; del.className = "danger"; del.textContent = "Delete";
    del.onclick = async () => { if (!confirm(`Delete ${item.name}?`)) return;
      await api("DELETE", "/items/" + item.id); d.close(); sel.item = null; toast("Item deleted"); route(); };
    $(".dlg-actions", d).prepend(del);
  }
}

/* ---------- router ---------- */
async function route() {
  const [, kind, id] = location.hash.split("/");
  try {
    if (kind === "home") await homeView(+id);
    else if (kind === "room") await roomView(+id);
    else if (kind === "settings") await settingsView();
    else await homesView();
  } catch (e) {
    chrome("Not found", null);
    app.innerHTML = `<div class="panel"><div class="empty">${esc(e.message)}. <a href="#/">Back to homes</a></div></div>`;
  }
}
window.addEventListener("hashchange", route);
api("GET", "/meta").then(m => { META = m; }).finally(route);
</script>
