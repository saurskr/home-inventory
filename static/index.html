<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Inventory</title>
<style>
:root{
  --background:#dbd37d; --ink:#060324;
  --surface:color-mix(in srgb,var(--background) 40%,white);
  --surface-2:color-mix(in srgb,var(--background) 75%,white);
  --line:color-mix(in srgb,var(--ink) 22%,var(--background));
  --muted:color-mix(in srgb,var(--ink) 65%,var(--background));
  --danger:#8f1d1d;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;
  border-bottom:2px solid var(--ink)}
header h1{font-size:1.2rem;margin:0}
header a{color:var(--ink);text-decoration:none}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.crumbs{color:var(--muted);margin-bottom:12px;font-size:.95rem}
.crumbs a{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:8px 0 16px}
h2{margin:0;font-size:1.5rem}
.sub{color:var(--muted);margin:2px 0 0}
button,.btn{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--surface);
  color:var(--ink);padding:6px 14px;border-radius:var(--radius)}
button:hover{background:var(--surface-2)}
button.primary{background:var(--ink);color:var(--background)}
button.primary:hover{background:color-mix(in srgb,var(--ink) 85%,white)}
button.danger{border-color:var(--danger);color:var(--danger)}
button.small{padding:3px 10px;font-size:.9rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.link{cursor:pointer}
.card.link:hover{border-color:var(--ink)}
.card h3{margin:0 0 4px;font-size:1.1rem}
.stat{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--surface-2);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface-2)}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border:1px solid var(--ink);border-radius:99px}
.empty{padding:30px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--radius)}
.table-wrap{overflow-x:auto}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--background);color:var(--ink);
  padding:20px;width:min(520px,94vw);max-height:92vh}
dialog::backdrop{background:color-mix(in srgb,var(--ink) 55%,transparent)}
dialog h3{margin-top:0}
label{display:block;font-size:.9rem;margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:7px 9px;border:1.5px solid var(--ink);
  border-radius:8px;background:var(--surface);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px}
.check input{width:auto}
.preview{max-width:100%;max-height:160px;border-radius:8px;margin-top:6px;border:1px solid var(--line)}
.err{color:var(--danger);margin-top:10px;min-height:1.2em}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--background);padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1><a href="#/">Home Inventory</a></h1></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n || 0).toLocaleString(undefined, {style:"currency", currency:"USD"});
let META = {item_types: [], room_templates: {}};

async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method, headers: {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}
const readFile = f => new Promise((ok, no) => {
  const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f);
});

/* ---------- dialog helper ---------- */
// fields: [{name,label,type,value,options,required,full}], onSubmit(values) -> promise
function form(title, html, onSubmit, {submit = "Save"} = {}) {
  const d = $("#dlg");
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${html}
    <div class="err" role="alert"></div>
    <div class="actions"><button type="button" data-x>Cancel</button>
    <button class="primary">${esc(submit)}</button></div></form>`;
  $("[data-x]", d).onclick = () => d.close();
  $("form", d).onsubmit = async e => {
    e.preventDefault();
    try { await onSubmit($("form", d)); d.close(); }
    catch (err) { $(".err", d).textContent = err.message; }
  };
  d.showModal();
  const first = $("input,select,textarea", d); if (first) first.focus();
}
const field = (name, label, v = "", attrs = "") =>
  `<label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" value="${esc(v)}" ${attrs}>`;
const area = (name, label, v = "") =>
  `<label for="f_${name}">${esc(label)}</label><textarea id="f_${name}" name="${name}" rows="2">${esc(v)}</textarea>`;
const select = (name, label, opts, cur, blank) =>
  `<label for="f_${name}">${esc(label)}</label><select id="f_${name}" name="${name}">` +
  (blank ? `<option value="">${esc(blank)}</option>` : "") +
  opts.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? "selected" : ""}>${esc(t)}</option>`).join("") +
  `</select>`;
const val = (f, n) => f.elements[n].value;

/* ---------- views ---------- */
const app = $("#app");

async function homesView() {
  const homes = await api("GET", "/homes");
  app.innerHTML = `
    <div class="bar"><div><h2>Homes</h2><p class="sub">Everything stays on this computer.</p></div>
      <button class="primary" id="add">+ Add home</button></div>
    ${homes.length ? `<div class="grid">${homes.map(h => `
      <div class="card link" data-id="${h.id}">
        <h3>${esc(h.name)}</h3><div class="stat">${esc(h.address || "No address")}</div>
        <div class="stat">${h.room_count} rooms · ${h.item_count} items</div>
        <div class="stat">Replacement value: <b>${money(h.total_replacement)}</b></div>
        <div class="row"><button class="small" data-edit="${h.id}">Edit</button>
        <button class="small danger" data-del="${h.id}">Delete</button></div>
      </div>`).join("")}</div>` : `<div class="empty">No homes yet. Add your first home to start cataloging.</div>`}`;
  $("#add").onclick = () => homeForm();
  app.querySelectorAll(".card.link").forEach(c => c.onclick = e => {
    if (e.target.closest("button")) return; location.hash = "#/home/" + c.dataset.id; });
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () =>
    homeForm(homes.find(h => h.id == b.dataset.edit)));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const h = homes.find(h => h.id == b.dataset.del);
    if (!confirm(`Delete "${h.name}" with its ${h.room_count} rooms and ${h.item_count} items?`)) return;
    await api("DELETE", "/homes/" + h.id); toast("Home deleted"); route();
  });
}
function homeForm(h) {
  form(h ? "Edit home" : "Add home",
    field("name", "Name", h?.name, "required") + field("address", "Address (optional)", h?.address),
    async f => { const b = {name: val(f, "name"), address: val(f, "address")};
      h ? await api("PUT", "/homes/" + h.id, b) : await api("POST", "/homes", b); route(); });
}

async function homeView(id) {
  const [home, rooms] = await Promise.all([api("GET", "/homes/" + id), api("GET", `/homes/${id}/rooms`)]);
  app.innerHTML = `
    <div class="crumbs"><a href="#/">Homes</a> / ${esc(home.name)}</div>
    <div class="bar"><div><h2>${esc(home.name)}</h2>
      <p class="sub">${esc(home.address || "")} ${home.item_count} items · replacement ${money(home.total_replacement)}</p></div>
      <button class="primary" id="add">+ Add room</button></div>
    ${rooms.length ? `<div class="grid">${rooms.map(r => `
      <div class="card link" data-id="${r.id}"><h3>${esc(r.name)}</h3>
        <div class="stat">${esc(r.description)}</div>
        <div class="stat">${r.item_count} items · ${money(r.total_replacement)}</div>
        <div class="row"><button class="small" data-edit="${r.id}">Edit / move</button>
        <button class="small danger" data-del="${r.id}">Delete</button></div></div>`).join("")}</div>`
      : `<div class="empty">No rooms yet. Add one — common rooms can be pre-filled with typical items.</div>`}`;
  $("#add").onclick = () => roomAddForm(id);
  app.querySelectorAll(".card.link").forEach(c => c.onclick = e => {
    if (e.target.closest("button")) return; location.hash = "#/room/" + c.dataset.id; });
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () =>
    roomEditForm(rooms.find(r => r.id == b.dataset.edit)));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const r = rooms.find(r => r.id == b.dataset.del);
    if (!confirm(`Delete room "${r.name}" and its ${r.item_count} items?`)) return;
    await api("DELETE", "/rooms/" + r.id); toast("Room deleted"); route();
  });
}
function roomAddForm(homeId) {
  const names = Object.keys(META.room_templates);
  form("Add room",
    `<label for="f_name">Room name</label>
     <input id="f_name" name="name" list="tmpl" required autocomplete="off" placeholder="e.g. Kitchen">
     <datalist id="tmpl">${names.map(n => `<option value="${esc(n)}">`).join("")}</datalist>` +
    area("description", "Description (optional)") +
    `<label class="check"><input type="checkbox" name="prefill" id="pf"> <span id="pfl">Pre-fill with typical items</span></label>`,
    async f => {
      await api("POST", `/homes/${homeId}/rooms`,
        {name: val(f, "name"), description: val(f, "description"), prefill: f.elements.prefill.checked});
      route();
    });
  const upd = () => { const n = names.find(x => x.toLowerCase() === $("#f_name").value.trim().toLowerCase());
    $("#pf").disabled = !n; if (!n) $("#pf").checked = false;
    $("#pfl").textContent = n ? "Pre-fill: " + META.room_templates[n].map(i => i.name).join(", ")
      : "Pre-fill with typical items (pick a template room name)"; };
  $("#f_name").oninput = upd; upd();
}
async function roomEditForm(r) {
  const homes = await api("GET", "/homes");
  form("Edit room",
    field("name", "Name", r.name, "required") + area("description", "Description", r.description) +
    select("home_id", "Home (change to move this room and its items)", homes.map(h => [h.id, h.name]), r.home_id),
    async f => { await api("PUT", "/rooms/" + r.id,
      {name: val(f, "name"), description: val(f, "description"), home_id: +val(f, "home_id")});
      toast("Room saved"); route(); });
}

async function roomView(id) {
  const room = await api("GET", "/rooms/" + id);
  const [home, items] = await Promise.all([api("GET", "/homes/" + room.home_id), api("GET", `/rooms/${id}/items`)]);
  app.innerHTML = `
    <div class="crumbs"><a href="#/">Homes</a> / <a href="#/home/${home.id}">${esc(home.name)}</a> / ${esc(room.name)}</div>
    <div class="bar"><div><h2>${esc(room.name)}</h2>
      <p class="sub">${esc(room.description)} ${items.length} items · replacement ${money(room.total_replacement)}</p></div>
      <button class="primary" id="add">+ Add item</button></div>
    ${items.length ? `<div class="table-wrap"><table><thead><tr><th></th><th>Inv #</th><th>Item</th><th>Type</th>
      <th class="num">Purchased</th><th class="num">Replacement</th><th></th></tr></thead><tbody>
      ${items.map(i => `<tr>
        <td>${i.image ? `<img class="thumb" src="/images/${esc(i.image)}" alt="">` : `<div class="thumb"></div>`}</td>
        <td>${esc(i.inv_no)}</td>
        <td><b>${esc(i.name)}</b>${i.brand ? `<div class="stat">${esc(i.brand)}</div>` : ""}</td>
        <td>${i.item_type ? `<span class="tag">${esc(i.item_type)}</span>` : ""}</td>
        <td class="num">${money(i.purchased_value)}</td><td class="num">${money(i.replacement_value)}</td>
        <td><button class="small" data-edit="${i.id}">Edit</button></td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">No items in this room yet.</div>`}`;
  $("#add").onclick = () => itemForm(room);
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () =>
    itemForm(room, items.find(i => i.id == b.dataset.edit)));
}

async function itemForm(room, item) {
  const rooms = await api("GET", `/homes/${room.home_id}/rooms`);
  const imgs = {photo: null, similar: null};
  const img = (kind, label, cur) => `<label>${label}</label>
    <input type="file" accept="image/*" data-kind="${kind}">
    <img class="preview" data-prev="${kind}" ${cur ? `src="/images/${esc(cur)}"` : "hidden"} alt="">`;
  form(item ? `Edit ${item.inv_no}` : "Add item",
    field("name", "Name", item?.name, "required") +
    `<div class="two"><div>${field("brand", "Brand", item?.brand)}</div>
      <div>${select("item_type", "Type", META.item_types.map(t => [t, t]), item?.item_type, "— choose —")}</div></div>` +
    area("description", "Description", item?.description) +
    `<div class="two"><div>${field("purchased_value", "Purchased value ($)", item?.purchased_value ?? "", 'type="number" min="0" step="0.01"')}</div>
      <div>${field("replacement_value", "Replacement value ($)", item?.replacement_value ?? "", 'type="number" min="0" step="0.01" placeholder="defaults to purchased"')}</div></div>` +
    field("similar_url", "Link to a similar item", item?.similar_url, 'type="url" placeholder="https://"') +
    img("photo", "Photo", item?.image) + img("similar", "Image of similar item", item?.similar_image) +
    (item ? select("room_id", "Room", rooms.map(r => [r.id, r.name]), item.room_id) : ""),
    async f => {
      const b = {name: val(f, "name"), brand: val(f, "brand"), item_type: val(f, "item_type"),
        description: val(f, "description"), similar_url: val(f, "similar_url"),
        purchased_value: val(f, "purchased_value"), replacement_value: val(f, "replacement_value")};
      if (item) b.room_id = +val(f, "room_id");
      const saved = item ? await api("PUT", "/items/" + item.id, b) : await api("POST", `/rooms/${room.id}/items`, b);
      for (const k of ["photo", "similar"])
        if (imgs[k]) await api("POST", `/items/${saved.id}/image?kind=${k}`, {data: imgs[k]});
      toast("Item saved"); route();
    });
  const d = $("#dlg");
  d.querySelectorAll("input[type=file]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const url = await readFile(f); imgs[inp.dataset.kind] = url;
    const p = $(`[data-prev=${inp.dataset.kind}]`, d); p.src = url; p.hidden = false;
  });
  if (item) {
    const del = document.createElement("button");
    del.type = "button"; del.className = "danger"; del.textContent = "Delete";
    del.onclick = async () => { if (!confirm(`Delete ${item.name}?`)) return;
      await api("DELETE", "/items/" + item.id); d.close(); toast("Item deleted"); route(); };
    $(".actions", d).prepend(del);
  }
}

/* ---------- router ---------- */
async function route() {
  const [, kind, id] = location.hash.split("/");
  try {
    if (kind === "home") await homeView(+id);
    else if (kind === "room") await roomView(+id);
    else await homesView();
  } catch (e) {
    app.innerHTML = `<div class="empty">${esc(e.message)} — <a href="#/">back to homes</a></div>`;
  }
}
window.addEventListener("hashchange", route);
api("GET", "/meta").then(m => { META = m; }).finally(route);
</script>
</body>
</html>
